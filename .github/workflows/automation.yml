name: Automation Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  web-tests:
    name: Web tests (Playwright + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
      - name: Publish test summary
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: reports/web/junit.xml
          check_name: Web test results
      - name: Upload Playwright report (HTML, traces, videos, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-report
          path: reports/web/
          retention-days: 14

  api-tests:
    name: API tests (Java + REST Assured)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Run REST Assured tests
        run: mvn -B test
      - name: Generate HTML report
        if: always()
        run: mvn -B surefire-report:report-only
      - name: Publish test summary
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: api-automation/target/surefire-reports/TEST-*.xml
          check_name: API test results
      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: |
            api-automation/target/surefire-reports/
            api-automation/target/site/
          retention-days: 14
